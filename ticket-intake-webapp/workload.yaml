apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: ticket-intake-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: vm2-ticket-api
      name: http
      visibility: project
      envBindings:
        address: TICKET_API_URL
