apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: ticket-api

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - internal
      - external

dependencies:
  resources:
    - ref: vm2-ticket-db
      envBindings:
        dbname: TICKET_DB_DBNAME
        host: TICKET_DB_HOST
        password: TICKET_DB_PASSWORD
        port: TICKET_DB_PORT
        user: TICKET_DB_USER
    - ref: vm2-agent-auth
      envBindings:
        client_id: AGENT_AUTH_CLIENT_ID
        issuer: AGENT_AUTH_ISSUER
        jwks_url: AGENT_AUTH_JWKS_URL
        resource: AGENT_AUTH_RESOURCE
        scopes: AGENT_AUTH_SCOPES
    - ref: vm2-ai-classifica-ee62ace4
      envBindings:
        ANTHROPIC_API_KEY: ANTHROPIC_API_KEY
        ANTHROPIC_VERSION: ANTHROPIC_VERSION
