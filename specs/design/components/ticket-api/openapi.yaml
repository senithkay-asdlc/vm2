openapi: 3.0.3
info:
  title: Ticket API
  version: 0.1.0
  description: Support ticket triage - intake, AI classification/drafting, agent review.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            tickets:read-all: Every ticket in the queue
            tickets:edit-draft: Edit a ticket's drafted reply
            tickets:approve: Approve a ticket's drafted reply
            tickets:resolve: Mark a ticket resolved
  schemas:
    Ticket:
      type: object
      required: [id, customerName, customerEmail, subject, message, urgencyLevel, status, createdAt]
      properties:
        id: { type: string }
        customerName: { type: string }
        customerEmail: { type: string, format: email }
        subject: { type: string }
        message: { type: string }
        urgencyLevel: { type: string, enum: [low, medium, high, urgent], description: AI-assigned urgency }
        status: { type: string, enum: [new, draft-ready, approved, resolved] }
        draftReply: { type: string, nullable: true, description: AI-generated draft, editable by a Support Agent }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
    NewTicket:
      type: object
      required: [customerName, customerEmail, subject, message]
      properties:
        customerName: { type: string }
        customerEmail: { type: string, format: email }
        subject: { type: string }
        message: { type: string }
    DraftUpdate:
      type: object
      required: [draftReply]
      properties:
        draftReply: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - oauth2: []
paths:
  /tickets:
    post:
      operationId: createTicket
      summary: Submit a new ticket (public, unauthenticated)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTicket' }
      responses:
        '201':
          description: Ticket created, classified and drafted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400':
          description: Invalid submission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listTickets
      summary: Every ticket in the queue, optionally filtered
      security:
        - oauth2: [tickets:read-all]
      parameters:
        - name: urgencyLevel
          in: query
          schema: { type: string, enum: [low, medium, high, urgent] }
        - name: status
          in: query
          schema: { type: string, enum: [new, draft-ready, approved, resolved] }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Paginated list of tickets
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching tickets }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /tickets/{ticketId}:
    get:
      operationId: getTicket
      summary: Every ticket's full details
      security:
        - oauth2: [tickets:read-all]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ticket details, with urgency and draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '404':
          description: No such ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /tickets/{ticketId}/draft:
    patch:
      operationId: updateTicketDraft
      summary: Edit a ticket's drafted reply
      security:
        - oauth2: [tickets:edit-draft]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftUpdate' }
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '404':
          description: No such ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /tickets/{ticketId}/approve:
    post:
      operationId: approveTicket
      summary: Approve a ticket's drafted reply
      security:
        - oauth2: [tickets:approve]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ticket approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '404':
          description: No such ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /tickets/{ticketId}/resolve:
    post:
      operationId: resolveTicket
      summary: Mark a ticket resolved after its reply has been sent
      security:
        - oauth2: [tickets:resolve]
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ticket resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '404':
          description: No such ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
